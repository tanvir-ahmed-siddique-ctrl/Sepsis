# RESIDUAL-HAZARD-01 — preregistered before execution.
# Dataset A train+validation only. Dataset A test is closed; Dataset B is prohibited.
version: 1
seed: 42
outer_folds: 5
calibration_fraction: 0.2
policy_tuning_fraction_of_calibration: 0.5
fold_assignments: artifacts/challengers/TABULAR-AONLY-01/fold_assignments.json
target_file: data/processed/incident_targets_v1.parquet

# This is a fresh fold-wise reference using the conservative Run 4 recipe.
# It is not the frozen Run 4 artifact and never overwrites it.
reference:
  family: lightgbm
  params:
    num_leaves: 7
    max_depth: -1
    min_child_samples: 1000
    learning_rate: 0.03
    n_estimators: 3000
    subsample: 0.7
    subsample_freq: 1
    colsample_bytree: 0.3
    reg_alpha: 0.0
    reg_lambda: 5.0
    max_bin: 255

features:
  dynamics:
    variables: [HR, SBP, MAP, Resp, O2Sat]
    windows: [8, 12, 24]
    minimum_synchronised_pairs: 5
    # Descriptive sparse-hour dynamics, not transfer entropy or causal physiology.
  healthy_residual:
    targets: [HR, SBP, MAP, Resp, O2Sat, Temp, Lactate, Creatinine]
    predictors: [HR, SBP, MAP, Resp, O2Sat, Temp, Age, Gender, ICULOS, HospAdmTime]
    ridge_alpha: 10.0
    minimum_observations: 500
    windows: [3, 6, 12]
    fit_nonseptic_patients_only: true
    # Reference-trajectory residuals, not counterfactual outcomes.
  orthobio:
    bio: [HR, SBP, MAP, Resp, O2Sat, Temp, Lactate, Creatinine, BUN, Platelets, WBC, Bilirubin_total]
    care_suffixes: [_missing, _hours_since, _count_24h]
    care_context: [ICULOS, HospAdmTime, Unit1, Unit2, labs_measured_24h]
    ridge_alpha: 100.0
    # Linear residualisation only; no causal or confounder-free claim.

feature_candidates:
  - reference
  - plus_dynamics
  - plus_healthy_residual
  - plus_orthobio
  - safe_stack

hazard:
  horizons: [1, 3, 6, 12]
  # Inner grouped cross-fitting produces every meta-training prediction.
  inner_folds: 4
  params:
    num_leaves: 7
    max_depth: -1
    min_child_samples: 500
    learning_rate: 0.03
    n_estimators: 2000
    subsample: 0.7
    subsample_freq: 1
    colsample_bytree: 0.3
    reg_alpha: 0.0
    reg_lambda: 5.0
    max_bin: 127
  meta:
    kind: logistic_regression
    C: 0.1
    inputs: [reference_logit, hazard_logits, adjacent_logit_differences]

policy:
  candidates: [raw, ema, hysteresis, persistence]
  threshold_candidates: 60
  ema_alpha: [0.35, 0.5, 0.7]
  hysteresis_low_ratio: [0.5, 0.7]
  persistence_hours: [2, 3]
  acute_surge_delta: [0.03, 0.05]
  minimum_specificity: 0.95
  maximum_sensitivity_drop: 0.02
  maximum_false_alert_increase_per_100h: 0.05

pseudo_sites:
  clusters: 3
  minimum_rows_for_metric: 25

selection:
  primary: mean_normalized_utility
  secondary: mean_auprc
  safety:
    minimum_utility_gain: 0.005
    maximum_auroc_drop: 0.005
    maximum_auprc_drop: 0.005
    maximum_worst_pseudo_site_auprc_drop: 0.01
  simplicity_rule: keep_reference_unless_all_safety_checks_pass
  internal_test_access: prohibited_closed_split
  dataset_b_access: prohibited_during_development
