name: PredictRx Sentinel CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            backend/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt -r backend/requirements.txt
          pip install -e ./ml
      - name: Verify frozen artifact hashes
        working-directory: ml
        run: >-
          python -m predict_rx.governance.integrity
          --source artifacts/models/latest
          --destination artifacts/models/run4_frozen
          --ml-root .
          --repo-root ..
      - name: Run ML tests
        working-directory: ml
        run: pytest -q
      - name: Verify database migrations (upgrade, downgrade, upgrade)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///${{ runner.temp }}/migrations.db"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current | grep -q "(head)"
      - name: Run API tests
        working-directory: backend
        run: pytest -q
      - name: Check site configuration tooling
        working-directory: backend
        env:
          DEMO_MODE: "false"
        # A default configuration must be reported as unsafe for a hospital site (exit code 1).
        run: |
          set +e
          python -m app.ops_cli check-config
          test $? -eq 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack in silent mode
        env:
          SITE_MODE: silent
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Probe health, readiness and blinding
        run: |
          curl -fsS http://localhost:8000/health | tee health.json
          grep -q '"site_mode":"silent"' health.json
          curl -fsS http://localhost:8000/ready | tee ready.json
          grep -q '"status":"ready"' ready.json
          curl -fsS -o /dev/null http://localhost:3000/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/metrics -H 'X-Demo-Role: clinician' -H 'X-Demo-User: ci')" = "403"
      - name: Backup and verify the audit chain inside the container
        run: |
          docker compose exec -T api python -m app.ops_cli backup --out /app/backups/ci.json.gz
          docker compose exec -T api python -m app.ops_cli verify-audit
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
